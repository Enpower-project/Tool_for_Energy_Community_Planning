<div class="flex">
  <div class="mdl-card mdl-shadow--2dp">
    <div class="mdl-card__supporting-text">
      <div class="mdl-stepper-horizontal-alternative">
        <ng-container *ngFor="let item of getSteps(numberSteps); let i = index">
          <div class="mdl-stepper-step " [class.active-step]="actualStep == i">
            <div class="mdl-stepper-circle" [class.disabled-step]="maxAvailableStep <= i" (click)="changeStep(i)">
              <span>{{i + 1}}</span>
            </div>
            <div class="mdl-stepper-bar-left"></div>
            <!-- [class.enable-step]="actualStep == i || actualStep == i - 1" *ngIf="i != 0" -->
            <div class="mdl-stepper-bar-right"></div>
            <!--  [class.enable-step]="actualStep == i || actualStep == i + 1" -->
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
