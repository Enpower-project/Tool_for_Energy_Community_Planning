<div class="page">
  <div class="carousel-container">
    <button (click)="prevNumber()" class="nav-button">Prev</button>
    <div class="carousel-wrapper">
      <div class="carousel-content" [style.transform]="getNumberTransform()">
        <div class="item" *ngFor="let item of numberItems">
          <h4>{{ item }}</h4>
        </div>
      </div>
    </div>
    <button (click)="nextNumber()" class="nav-button">Next</button>
  </div>
</div>
