<div *ngIf="show" class="card" [class.card-selected]="selected" (click)="selectedACard()" 
(mouseenter)="addHover()" (mouseleave)="removeHover()">
  <div>
    <div class="content-area">
      <div class="icon-wrapper">
        <img PreventContextMenu class="header-icon" [src]="'./assets/icons/' + cardItem.iconName">
      </div>
      <div class="text-area">
        <div class="area-title">
          <div>
            {{cardItem.title | translate}}
          </div>
          <img PreventContextMenu *ngIf="cardItem.infoIcon" src="./assets/icons/help-circle-orange.svg" alt="info icon"
            (click)="showInfoCard()">
        </div>
        <div class="bottom-zone">
          @if (cardItem.description) {
          <div class="area-description">{{cardItem.description | translate}}</div>
          }
          @if (cardItem.subtitle) {
          <div class="area-subtitle">{{cardItem.subtitle | translate}}</div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
