<div class="dropdown" [class.smart]="smartDropdown">
  <div class="heading" [class.selected]="active">
    <div class="content" (click)="active = !active ; showMore = false">
      <div class="text">{{title | translate}}</div>
      <div class="deploy-icon"> <img PreventContextMenu class="header-icon"
          [src]=" active ? './assets/icons/minus.svg' :'./assets/icons/plus.svg'"></div>
    </div>
  </div>
  @if(active && mainText){

  <div class="boding" [class.fade-in]="active">
    <div class="body-text">
      {{mainText | translate}}

      @if(showMore){
      <p [class.fade-in]="active">
        {{subText | translate}}
      </p>
      }

    </div>
    @if(subText){
    <div class="show-more" (click)="showMore = !showMore">
      {{(showMore ? "NAVIGATION.SEE_LESS" : "NAVIGATION.SEE_MORE") |translate}}
    </div>
    }
  </div>
  }

</div>
