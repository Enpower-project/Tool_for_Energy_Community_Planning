<main class="sidebar">
  <div class="header">
    <div> <img PreventContextMenu (click)="goTo(APP_ROUTES.HOME)" class="header-icon"
        src="./assets/logos/ENPOWER_LOGO_COLOR.png" /></div>
    <lang-selectups [sidebarMode]="true" [showLangSelector]="showLangSelector"
      (changeShowLang)="changeShowLangSelector($event)"></lang-selectups>
  </div>
  <div class="menu">
    <div>{{"MENU.DESKTOP.MENU.HEADING" | translate}}</div>
    <div>
      @for (navMenu of priNavigationMenu; track $index) {
      <nav-controlitups [navigation]="navMenu" [currentStep]="currentStep"
        (navigate)="navigate($event)"></nav-controlitups>
      }
    </div>
  </div>
  @if(isLoggedIn){
  <div>
    <separatups [isBlueSeparator]="true"></separatups>
  </div>
    <div class="menu">
      <div>{{"MENU.DESKTOP.MY_COMMUNITY.HEADING" | translate}}</div>
      <div>
        @for (navMenu of secNavigationMenu; track $index) {
        <nav-controlitups (navigate)="secundaryNav($event)" [currentStep]="currentStep"
          [navigation]="navMenu"></nav-controlitups>
        }
      </div>
    </div>
  }
  <div class="footer">
    <div>
      <div><img src="./assets/images/eu_footer.png"></div>
      <div>
      </div>
    </div>
  </div>
</main>
