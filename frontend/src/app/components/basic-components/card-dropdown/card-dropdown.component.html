<div class="card-selection-container">
  <div class="card-scenario" (click)="openCardScenario = !openCardScenario">
    <div class="main-text-container">
      <div>
        <div><img [src]="icon"></div>
        <div>{{title | translate}}</div>
      </div>
      <img PreventContextMenu [src]=" !openCardScenario ? './assets/icons/chevron-down.svg' : './assets/icons/chevron-up.svg'">
    </div>
    @if (score!== undefined) {
    <div class="ratting">
      <div>
        @for (item of [0,0,0,0,0]; track $index) {
        @if((score)<($index +1)){ <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
            stroke="#2C2D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          }@else {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
              fill="#F9C635" stroke="#2C2D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          }

          }

      </div>
      <div>{{scoreSTR}} ({{votes}} votes)</div>
    </div>
    }
    @if (info) {
    <div class="info">
      <div>{{info?.name}}</div>
      <div>{{info?.date}}</div>
      <div>{{info?.locate}}</div>
    </div>
    }
    @if(openCardScenario && description){
    <div class="main-text-container">
      {{description |translate}}
    </div>
    }

  </div>
