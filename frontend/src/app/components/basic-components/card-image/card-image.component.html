<div class="card-image">
  <div class="image"  (click)="clickOnImage()">
    @if(imgUrl){
    <img PreventContextMenu [src]="imgUrl" />
    }
  </div>
  <div class="body">
    <section>
      <div>
        <div class="title">{{titleCard | translate}}</div>
        <div class="description" [class.show-more]="showMore">{{descriptionCard | translate}}</div>
        @if(readmore){
        @if(showMore){
        <div class="read-more" (click)="showMore= !showMore">{{"NAVIGATION.SEE_LESS" | translate}}</div>
        }@else {
        <div class="read-more" (click)="showMore= !showMore">{{"NAVIGATION.READ_MORE" | translate}}</div>
        }
        }
      </div>
    </section>
    <section>
      @if(badges){
      <div class="badges">
        @for (badge of badges; track $index) {
        <badgitups [title]="badge"></badgitups>
        }
      </div>
      }
      @if(flagUrl){
      <div class="flag">
        <img PreventContextMenu [src]="flagUrl" />
      </div>
      }
    </section>
  </div>
</div>
