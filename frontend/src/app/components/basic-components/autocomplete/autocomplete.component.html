<div class="select-container">
  @if(title){
  <div class="text-top">{{title}}</div>
  }
  <div class="container" [formGroup]="form">
    <div class="input-address">
      <input type="text"  (click)="show()" [placeholder]="placeHolder | translate" class="input-field" formControlName="valor">
      <span class="icon-input">
        <img PreventContextMenu class="icon" [class.pulse-effect]="false" [src]="'./assets/icons/' + icon">
      </span>
    </div>
    @if(openSelect && !disabled && options){
    <div class="select-dropdown">
      @for (item of options; track $index) {
      <div class="select-option">
        <div class="option" (click)="selectOption($index)">{{item}}</div>
      </div>
      }
    </div>
    <div class="dropdown-space"></div>
    }
  </div>
  @if(hint){
  <div class="text-bottom">
    <img PreventContextMenu src="./assets/icons/info-lightgray.svg" class="info-icon">
    <span>{{hint | translate}}</span>
  </div>
  }

</div>
