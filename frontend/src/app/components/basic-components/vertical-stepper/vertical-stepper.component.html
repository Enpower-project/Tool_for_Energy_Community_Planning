<div class="outer">
  <div class="progress">
    <div class="left">
      @for (item of steps; track $index) {
      <div></div>
      }
    </div>
    <div class="right">
      @for (step of steps; track $index) {
      <div [class.current]="$index === (currentPostion >= steps.length ? (steps.length -1):  currentPostion)">
        {{step?.name |translate}}</div>
      }
    </div>
  </div>
</div>
