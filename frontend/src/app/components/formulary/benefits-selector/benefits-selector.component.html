<app-steps-structure [disabledButton]="!this.form.valid" (back)="back()" (close)="closeIt()" (next)="goNext()"
  [title]="'CREATE_SCENARIOS.PRIORITISE_BENEFITS.HEADING'">
  <div class="selector-container" [formGroup]="form">
    <div>
      <button class="btn btn-secundary-cta" (click)="setControlValue('INDIVIDUAL')"
        [class.selected-chip]="this.form.controls['selectedButton'].value === 'INDIVIDUAL'">{{"CREATE_SCENARIOS.PRIORITISE_BENEFITS.INDIVIDUAL" |
        translate
        }}</button>
      <button class="btn btn-secundary-cta" (click)="setControlValue('SHARED')"
        [class.selected-chip]="this.form.controls['selectedButton'].value === 'SHARED'">{{"CREATE_SCENARIOS.PRIORITISE_BENEFITS.SHARED" |
        translate
        }}</button>
    </div>
  </div>
  <div class="image-container">
    <img PreventContextMenu [src]="imgSrc" alt="people talking" />
  </div>
</app-steps-structure>
<loading [show]="loading"></loading>
