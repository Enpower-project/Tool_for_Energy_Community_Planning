<app-steps-structure [disabledButton]="!this.form.valid" (back)="back()" (close)="closeIt()" (next)="goNext()" [loading]="loading"
    [subtitle]="'COMMUNITY.FIND_COMMUNITY.CAPTION_1'" [title]="'COMMUNITY.FIND_COMMUNITY.HEADING_1'">
    <loading [show]="loading" ></loading>
    <div class="form-app" [formGroup]="form">
        <div class="input-address">
            <input type="text" [placeholder]="'BASELINE.LOCATION.SEARCH_LOCATION' | translate" class="input-field"
                formControlName="location">
            <span (click)="searchStreet()" class="icon-input">
                <img PreventContextMenu class="icon" src="./assets/icons/search.svg">
            </span>
        </div>
        <div id="map_find" class="map_find">
            <div class="map-loading">
                <loading [show]="mapLoading" [isAbsolute]="true"></loading>
            </div>
        </div>
        @if(showCommunityList){
        <div class="community-list-container">
            <div class="question">
                <div>{{"COMMUNITY.FIND_COMMUNITY.HEADING_2" | translate}}</div>
                <div>{{"COMMUNITY.FIND_COMMUNITY.CAPTION_2" | translate}}</div>
            </div>
            <div class="cards-community-container">
                @for (cardItem of this.cardList; track $index) {
                <basic-cardtups [selected]="this.form.controls['community'].value ===cardItem"
                    (selectCard)="selectCommunity(cardItem)" [cardItem]="cardItem"
                    [iconHoverChange]="false"></basic-cardtups>
                }
            </div>
        </div>
        }
        <div class="create">
            <div>{{ "COMMUNITY.FIND_COMMUNITY.CANT_FIND" | translate}}</div>
            <div class="see-more" (click)="createYourCommunity()">{{ "COMMUNITY.FIND_COMMUNITY.CREATE_IT" | translate}}
            </div>
        </div>
    </div>
</app-steps-structure>
