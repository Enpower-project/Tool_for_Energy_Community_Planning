<app-steps-structure [disabledButton]="true" [nextButton]="false" (back)="back()" (close)="closeIt()" [header]="false">
  <div class="container" [formGroup]="form">
    <div class="stack-container">
      <card-droptups [title]="selectedCard.title" [description]="selectedCard.info" [icon]="'./assets/icons/' + selectedCard.iconName" [info]="{name: 'User.01', date: '18  march 2024', locate:'Valladolid-01'}">
      </card-droptups>
    </div>
    <div class="pc-container">
      <div>
        <div class="title-question">
          <div>
            {{ "SCENARIO.RESULTS_FOR_THIS_GOAL" | translate}}
          </div>
        </div>
        <div class="card-container">
          <div>
            <kpi-cardtups [type]="'red'" [title]="'COMMUNITY.KPI_CARD.LOSS_OF_LOAD.KPI_NAME'" [bodyValue]="882"
              [bodyValueText]="'COMMUNITY.KPI_CARD.LOSS_OF_LOAD.UNIT'" [bodyText]="'COMMUNITY.KPI_CARD.LOSS_OF_LOAD.DESCRIPTION'"
              [footerText]="'COMMUNITY.KPI_CARD.LOSS_OF_LOAD.CITIZEN_KPI.A'" [topIcon]="'ray_icon_pink.svg'"
              [footerIcon]="'arrow-right.svg'"></kpi-cardtups>
            <kpi-cardtups [type]="'green'" [title]="'COMMUNITY.KPI_CARD.CO2_EMISSIONS_REDUCTION.KPI_NAME'" [bodyValue]="882"
              [bodyValueText]="'COMMUNITY.KPI_CARD.CO2_EMISSIONS_REDUCTION.UNIT'"
              [bodyText]="'COMMUNITY.KPI_CARD.CO2_EMISSIONS_REDUCTION.DESCRIPTION'"
              [footerText]="'COMMUNITY.KPI_CARD.CO2_EMISSIONS_REDUCTION.CITIZEN_KPI.A'" [topIcon]="'cloud-green.svg'"
              [footerIcon]="'arrow-right.svg'"></kpi-cardtups>
          </div>
          <div>
            <kpi-cardtups [type]="'blue'" [title]="'COMMUNITY.KPI_CARD.PRODUCTION_COSTS.KPI_NAME'" [bodyValue]="882"
              [bodyValueText]="'COMMUNITY.KPI_CARD.PRODUCTION_COSTS.UNIT'" [bodyText]="'COMMUNITY.KPI_CARD.PRODUCTION_COSTS.DESCRIPTION'"
              [footerText]="'COMMUNITY.KPI_CARD.PRODUCTION_COSTS.CITIZEN_KPI.A'" [topIcon]="'coins-blue.svg'"
              [footerIcon]="'arrow-right.svg'"></kpi-cardtups>
            <kpi-cardtups [type]="'yellow'" [title]="'COMMUNITY.KPI_CARD.INVESTMENT_COSTS.KPI_NAME'" [bodyValue]="882"
              [bodyValueText]="'COMMUNITY.KPI_CARD.INVESTMENT_COSTS.UNIT'" [bodyText]="'COMMUNITY.KPI_CARD.INVESTMENT_COSTS.DESCRIPTION'"
              [footerText]="'COMMUNITY.KPI_CARD.INVESTMENT_COSTS.CITIZEN_KPI.A'" [topIcon]="'coins-yellow.svg'"
              [footerIcon]="'arrow-right.svg'"></kpi-cardtups>
          </div>
        </div>
      </div>
      <div class="actions-container-pc">
        <div>
          <div class="title-question">
            <div>
              {{ "SCENARIO.ACTIONS" | translate}}
            </div>
          </div>
          <div class="stack-container">
            <div class="action-container">
              <div class="selection-container">
                @for (action of alternativas; track $index) {
                <div>
                  <dropdowntups [title]="'RESOURCES.GLOSSARY.ACTIONS.'+ action.translate +'.TERM'"
                    [mainText]="'RESOURCES.GLOSSARY.ACTIONS.'+ action.translate +'.P1'"
                    [subText]="'RESOURCES.GLOSSARY.ACTIONS.'+ action.translate +'.P2'" [smartDropdown]="true">
                  </dropdowntups>
                  <label class="check-tick">
                    <input type="checkbox" [formControlName]="action.controlName" />
                    <span class="checkmark"></span>
                  </label>
                </div>
                }
              </div>
            </div>
          </div>
        </div>
        <div class="stack-container">
          <div class="buttons-container">
            <div>
              <!-- <div>
                <div class="button-blue"> <img PreventContextMenu src="./assets/icons/edit-white.svg"></div>
                <div>{{"SCENARIO.EDIT" | translate}}</div>
              </div> -->
              <div>
                <div (click)="createNewAlternative()"><img PreventContextMenu src="./assets/icons/plus.svg"></div>
                <div (click)="createNewAlternative()">{{"SCENARIO.NEW" | translate}}</div>
              </div>
              <div >
                <div (click)="openCompareOption()"> <img PreventContextMenu src="./assets/icons/copy.svg" ></div>
                <div (click)="openCompareOption()">{{"SCENARIO.COMPARE" | translate}}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-steps-structure>

<app-compare [isOpen]="openCompare" (closeModal)="openCompare = false"></app-compare>
