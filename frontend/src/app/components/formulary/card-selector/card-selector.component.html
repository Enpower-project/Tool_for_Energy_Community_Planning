<app-steps-structure [disabledButton]="!this.form.valid" (back)="back()" (close)="closeIt()" (next)="goNext()" [loading]="loading"
  [title]="'CREATE_SCENARIOS.GOAL_MENU.HEADING'" [subtitle]="'CREATE_SCENARIOS.GOAL_MENU.BODY'">
  <div class="card-form" [formGroup]="form" [class.expanded]="limit==4">
    @for (cardItem of cardArray| slice:0:limit; track $index){
    <basic-cardtups [selected]="$index === selectedcard" [show]="cardItem.show !== false" [cardItem]="cardItem"
      (selectCard)="selectCard(cardItem,$index)" (showInfo)="showInfo(cardItem)"></basic-cardtups>
    }

    <basic-cardtups [selected]="(cardArray.length -1) === selectedcard" [show]="true"
      [cardItem]="cardArray[(cardArray.length -1)]"
      (selectCard)="selectCard(cardArray[(cardArray.length -1)],(cardArray.length -1))"
      (showInfo)="showInfo(cardArray[(cardArray.length -1)])"></basic-cardtups>
    <div class="see-more"><span (click)="showMoreOrLess()">{{'NAVIGATION.' +textShowMore | translate}}</span></div>
  </div>
  <div>
    <div class="card-form-pc expanded" [formGroup]="form">
      @for (cardItem of cardArray; track $index){
        <div class="div-card-pc-container">
          <basic-cardtups [selected]="$index === selectedcard" [cardItem]="cardItem"
          (selectCard)="selectCard(cardItem,$index)" (showInfo)="showInfo(cardItem)"></basic-cardtups>
        </div>
      }
    </div>
  </div>
</app-steps-structure>
