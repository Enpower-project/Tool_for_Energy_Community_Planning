version: '2'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLISH_COMPODOC: ${PUBLISH_COMPODOC}

    image: enpower/front
    container_name: enpower_front
    restart: always
    ports:
      - $API_PORT_FRONT:80
    
networks:
  default:
    external:
      name: enpower_network
