variables:
  API_PORT_FRONT: $API_PORT_FRONT
  API_URL: $API_URL

before_script:
  - mv frontend frontend_enpower
  - cd frontend_enpower

dev_build:
  environment: development
  stage: build
  only:
    - dev_frontend
  tags:
    - nix
  script:
    - sed -i "s|API_URL:\ ''|API_URL:\ \"$API_URL\"|g" ./src/environments/environment.prod.ts
    - export PUBLISH_COMPODOC="true"
    - docker-compose -p "enpower-front" up -d --build

prod_build:
  environment: production
  stage: build
  only:
    - main_frontend
  tags:
    - everest
  script:
    - sed -i "s|API_URL:\ ''|API_URL:\ \"$API_URL\"|g" ./src/environments/environment.prod.ts
    - export PUBLISH_COMPODOC="false"
    - docker-compose -p "enpower-front" up -d --build

